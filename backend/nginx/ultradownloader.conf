server {
    listen 80;
    server_name ultradownloader.pro www.ultradownloader.pro;
    client_max_body_size 25M;

    # Frontend Production SPA Static Assets
    root /var/www/ultradownloader/frontend/dist;
    index index.html;

    # CRITICAL: Unbuffered Real-Time Server-Sent Events (SSE) for Admin Live Notification Feed
    location /api/v1/admin/live-cards/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # Streaming HTTP 206 Partial Content Range Proxy & Resumable Downloads
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4000/sitemap.xml;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:4000/robots.txt;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
